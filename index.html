<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resources</title>
    <meta name="description" content="A personal collection of links and resources." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Inter:wght@400&family=Manrope:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://use.typekit.net/rlg1ntq.css" />
    <link rel="stylesheet" href="styles.css?v=9" />
  </head>
  <body>
    <div class="art" aria-hidden="true">
      <div class="stage">
        <img class="painting" src="assets/painting.webp?v=9" alt="" width="1686" height="2048" />
        <img class="pose bird-1 pose-b" src="assets/bird-1-b.webp?v=9" alt="" width="546" height="415" />
        <img class="pose bird-1 pose-c" src="assets/bird-1-c.webp?v=9" alt="" width="546" height="415" />
        <img class="pose bird-2 pose-b" src="assets/bird-2-b.webp?v=9" alt="" width="606" height="293" />
        <img class="pose bird-2 pose-c" src="assets/bird-2-c.webp?v=9" alt="" width="606" height="293" />
        <img class="pose bird-3 pose-b" src="assets/bird-3-b.webp?v=9" alt="" width="619" height="426" />
        <img class="pose bird-3 pose-c" src="assets/bird-3-c.webp?v=9" alt="" width="619" height="426" />
        <img class="pose bird-4 pose-b" src="assets/bird-4-b.webp?v=9" alt="" width="470" height="315" />
        <img class="pose bird-4 pose-c" src="assets/bird-4-c.webp?v=9" alt="" width="470" height="315" />
      </div>
      <div class="leaves" id="leaves"></div>
    </div>

    <main class="content">
      <h1 class="title">Resources</h1>
      <div id="groups" class="groups"></div>
    </main>

    <template id="group-template">
      <section class="group">
        <h2 class="group-title"></h2>
        <ul class="links"></ul>
      </section>
    </template>

    <template id="link-template">
      <li class="link-row">
        <span class="marker" aria-hidden="true">
          <img class="icon" alt="" width="17" height="17" loading="lazy" />
        </span>
        <a class="link" target="_blank" rel="noopener noreferrer">
          <span class="link-text"></span>
          <img class="underline" src="assets/underline.svg" alt="" width="191" height="1" />
        </a>
      </li>
    </template>

    <script src="links.js?v=9"></script>
    <script src="main.js?v=9"></script>
  </body>
</html>
